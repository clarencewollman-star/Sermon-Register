services:
  sermon-register:
    image: ghcr.io/clarencewollman-star/sermon-register:main
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      APP_ORIGIN: http://localhost:3000
      API_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
