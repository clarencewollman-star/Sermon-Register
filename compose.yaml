services:
  sermon-register:
    image: ghcr.io/clarencewollman-star/sermon-register:main
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3810:3000"
      - "3811:3001"
    environment:
      APP_ORIGIN: http://localhost:3810
      API_HOST: 0.0.0.0
    volumes:
      - /docker/sermonregister/data:/app/data
